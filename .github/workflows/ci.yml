name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 엔진·해석 빌드와 테스트
        run: |
          pnpm --filter @saju/engine build
          pnpm --filter @saju/reading build
          pnpm --filter @saju/engine test
          pnpm --filter @saju/reading test
      - name: 웹 빌드
        run: pnpm --filter @saju/web build
